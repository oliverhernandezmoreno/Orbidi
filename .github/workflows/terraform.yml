name: terraform-infra-provisioning

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita applies concurrentes sobre el mismo estado.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.6"
  AWS_REGION_NAME: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'orbidi/api' }}

jobs:
  # ------------------------------------------------------------------
  # Gate sin credenciales: valida los dos root modules.
  # ------------------------------------------------------------------
  validate:
    name: fmt-and-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (sin backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Bootstrap Format
        working-directory: bootstrap
        run: terraform fmt -check -recursive -diff

      - name: Bootstrap Init (sin backend)
        working-directory: bootstrap
        run: terraform init -backend=false -input=false

      - name: Bootstrap Validate
        working-directory: bootstrap
        run: terraform validate -no-color

      - name: Terraform Test (unit, mock provider)
        run: terraform test -no-color

      - name: Bootstrap Test (unit, mock provider)
        working-directory: bootstrap
        run: terraform test -no-color

  # ------------------------------------------------------------------
  # Linters bloqueantes (Fase 5).
  # ------------------------------------------------------------------
  lint:
    name: tflint-and-trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint (terraform)
        working-directory: terraform
        run: |
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --init
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --recursive --format compact

      - name: TFLint (bootstrap)
        working-directory: bootstrap
        run: |
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --init
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --recursive --format compact

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ------------------------------------------------------------------
  # Plan/Apply con AWS. Requiere:
  #   - bootstrap/ aplicado (estado remoto, ECR y rol OIDC)
  #   - variable AWS_DEPLOY_ENABLED=true y AWS_ROLE_ARN
  # ------------------------------------------------------------------
  deploy:
    name: plan-apply
    needs: [validate, lint]
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    defaults:
      run:
        shell: bash
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gh-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          cat > backend.hcl <<EOF
          bucket         = "orbidi-tfstate-${ACCOUNT_ID}"
          key            = "orbidi/terraform.tfstate"
          region         = "${AWS_REGION_NAME}"
          dynamodb_table = "orbidi-terraform-locks"
          encrypt        = true
          EOF

      - name: Terraform Init
        id: init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws ecr get-login-password --region "$AWS_REGION_NAME" \
            | docker login --username AWS --password-stdin \
                "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION_NAME}.amazonaws.com"

      - name: Build and push image
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION_NAME}.amazonaws.com/${ECR_REPOSITORY}:${{ steps.image.outputs.tag }}"
          docker build -t "$IMAGE" app
          docker push "$IMAGE"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="image_tag=${{ steps.image.outputs.tag }}" \
            -out=tfplan.binary

      - name: Terraform Show (JSON)
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan.binary
            terraform/tfplan.json
          retention-days: 5

      # -------------------- Infracost (opcional) --------------------
      - name: Setup Infracost
        if: github.event_name == 'pull_request' && vars.INFRACOST_SCAN_TYPE != '' && env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost diff
        if: github.event_name == 'pull_request' && vars.INFRACOST_SCAN_TYPE != '' && env.INFRACOST_API_KEY != ''
        run: |
          infracost diff --path=tfplan.json \
                         --format=json \
                         --out-file=/tmp/infracost.json

      - name: Post Infracost comment
        if: github.event_name == 'pull_request' && vars.INFRACOST_SCAN_TYPE != '' && env.INFRACOST_API_KEY != ''
        run: |
          infracost comment github --path=/tmp/infracost.json \
                                   --repo="$GITHUB_REPOSITORY" \
                                   --github-token="${{ github.token }}" \
                                   --pull-request="${{ github.event.pull_request.number }}" \
                                   --behavior=update

      # -------------------- Resumen en el PR --------------------
      - name: Post Terraform summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            <details><summary>Show plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # -------------------- Apply --------------------
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -input=false -auto-approve tfplan.binary

      # -------------------- Smoke test --------------------
      - name: Smoke test (/health)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          DNS=$(terraform output -raw alb_dns_name)
          for i in $(seq 1 20); do
            if curl -fsS "http://${DNS}/health"; then
              echo
              echo "Smoke test OK: http://${DNS}/health"
              exit 0
            fi
            echo "Intento ${i}/20: ALB aún no responde, esperando 15s..."
            sleep 15
          done
          echo "Smoke test falló: /health no respondió 200"
          exit 1
