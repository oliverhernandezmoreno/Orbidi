name: checkov-static-analysis-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  scan:
    name: checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      security-events: write # upload-sarif
      actions: read # estado del workflow para SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Fase 0: no bloqueamos merges por hallazgos conocidos.
          # En Fase 3 se pone en false con un baseline justificado.
          soft_fail: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif
